<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Emberhold launcher emblem: an ember over a stone tower on iron. Original art. -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#3d2a18"/>
      <stop offset="100%" stop-color="#15130f"/>
    </radialGradient>
    <linearGradient id="ember" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#b8361c"/>
      <stop offset="55%" stop-color="#e26b2d"/>
      <stop offset="100%" stop-color="#f6c15a"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <!-- ring -->
  <circle cx="512" cy="512" r="410" fill="none" stroke="#d9a94a" stroke-width="28"/>
  <!-- tower -->
  <g fill="#9a9182" stroke="#2b261f" stroke-width="16" stroke-linejoin="round">
    <rect x="380" y="430" width="264" height="330"/>
    <rect x="352" y="380" width="60" height="70"/>
    <rect x="612" y="380" width="60" height="70"/>
    <rect x="482" y="380" width="60" height="70"/>
  </g>
  <g fill="#6b6257">
    <rect x="380" y="430" width="34" height="330"/>
    <rect x="610" y="430" width="34" height="330"/>
  </g>
  <!-- gate -->
  <path d="M458 760 V640 a54 54 0 0 1 108 0 V760 Z" fill="#15130f"/>
  <!-- ember flame above the tower -->
  <path d="M512 150 C 470 230, 430 270, 452 332 C 466 372, 500 386, 512 386 C 524 386, 558 372, 572 332 C 594 270, 554 230, 512 150 Z" fill="url(#ember)"/>
  <path d="M512 262 C 496 296, 486 314, 496 340 C 502 356, 522 356, 528 340 C 538 314, 528 296, 512 262 Z" fill="#fff1c4" opacity="0.9"/>
  <!-- base -->
  <rect x="330" y="760" width="364" height="30" fill="#2b261f"/>
</svg>
