// -----------------------------------------------------------------------------
//  Kurd Castle — Android shell module
//
//  The playable web build in preview/ is copied into app/src/main/assets by the
//  :app:syncWebAssets task before assets are merged, so the repository keeps
//  exactly one copy of the game (the sources under preview/src) and the APK is
//  self-contained: no server, no network, no INTERNET permission.
//
//  Build:  gradle -p android-app/webview :app:assembleDebug
// -----------------------------------------------------------------------------
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.kurdcastle.prototype'
    compileSdk 34

    defaultConfig {
        applicationId 'com.kurdcastle.prototype'
        minSdk 24               // Android 7.0 — the WebView updates itself from Play
        targetSdk 34
        versionCode 1
        versionName '0.9.0-prototype'
        resConfigs 'en'
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled false
            shrinkResources false
            // Debug-signed so `assembleRelease` still yields an installable APK.
            // Point signingConfigs at your own keystore before a store upload
            // (see android-app/README.md).
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources.excludes += ['META-INF/*.version', 'DebugProbesKt.bin']
    }
}

dependencies {
    // WebViewAssetLoader serves the bundled files over a synthetic https origin,
    // which is what ES modules (and the service worker) require.
    implementation 'androidx.webkit:webkit:1.11.0'
}

// -----------------------------------------------------------------------------
//  Bundle the game: preview/ -> app/src/main/assets/
// -----------------------------------------------------------------------------
def previewDir = rootProject.file('../../preview')
def webAssetsDir = file("$projectDir/src/main/assets")

def syncWebAssets = tasks.register('syncWebAssets', Copy) {
    group = 'kurd castle'
    description = 'Copies the playable web build (preview/) into the APK assets.'
    from(previewDir) {
        exclude 'test/**'      // the headless suite has no business on a phone
        exclude '**/*.md'      // READMEs and notes
        exclude '.nojekyll'
    }
    into webAssetsDir
    // Cheap copy, and a stale asset folder is much worse than a redundant one.
    outputs.upToDateWhen { false }
    doFirst {
        logger.lifecycle("Bundling web build from ${previewDir}")
    }
    doLast {
        def index = new File(webAssetsDir, 'index.html')
        if (!index.exists()) {
            throw new GradleException("Web build missing: ${index} was not produced. " +
                    "Is preview/index.html present?")
        }
    }
}

androidComponents {
    onVariants(selector().all()) { variant ->
        // Runs before any asset merging for every variant (debug, release, ...).
        def mergeTask = tasks.named("merge${variant.name.capitalize()}Assets")
        mergeTask.configure { dependsOn syncWebAssets }
    }
}
tasks.named('preBuild').configure { dependsOn syncWebAssets }
