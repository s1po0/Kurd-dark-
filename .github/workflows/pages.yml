name: Publish playable preview

# Publishes preview/ to GitHub Pages, which gives the prototype a real HTTPS URL:
#   https://<owner>.github.io/<repo>/
# That URL is what you play on a phone, what you can point a Trusted Web Activity
# build at, and what you share with testers.
#
# One-time setup: repository Settings -> Pages -> Build and deployment ->
# Source: GitHub Actions. Until that is done, this workflow still runs the tests
# and uploads the site as an artifact, and says so in a notice instead of failing.
#
# The deployed site is a complete installable PWA: manifest, service worker and
# icons are all in preview/, so the URL can be added to a phone's home screen.

on:
  push:
    branches: [main]
    paths:
      - 'preview/**'
      - 'tools/check_pwa.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages_enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4

      - name: Sanity-check the build before publishing
        run: |
          for f in main sim render ui map balance; do node --check "preview/src/$f.js"; done
          node --check preview/sw.js
          node --check preview/pwa.js
          python3 -c "import json;json.load(open('preview/manifest.webmanifest'))"

      - name: Run the headless suite
        run: node preview/test/headless.mjs

      - name: Validate the installable-app plumbing
        run: python3 tools/check_pwa.py

      - name: Disable Jekyll processing
        run: touch preview/.nojekyll

      # Pages may not be switched on yet, and enabling it needs repository admin
      # rights that a workflow token does not have. Probe rather than assume.
      - id: pages
        name: Is GitHub Pages enabled?
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages")
          echo "Pages API returned $code"
          if [ "$code" = "200" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure Pages
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/configure-pages@v5

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: preview

      - name: Pages is not enabled (nothing broken)
        if: steps.pages.outputs.enabled != 'true'
        run: |
          echo "::notice title=GitHub Pages is not enabled yet::Turn it on once: Settings → Pages → Build and deployment → Source: GitHub Actions, then re-run this workflow. The suite passed and the site is attached to this run as an artifact in the meantime."

  deploy:
    needs: build
    if: needs.build.outputs.pages_enabled == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
