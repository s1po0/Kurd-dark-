name: Build Emberhold APK

# Builds the Emberhold Android app on GitHub's runners: tests, web build,
# generated Capacitor Android project, a stable signing key, and a release APK.
#
#   * push to main or arena/**     -> APK uploaded as the "emberhold-apk" artifact
#   * push a tag emberhold-v*      -> APK also attached to a GitHub Release
#   * workflow_dispatch            -> build on demand
#
# No local terminal is needed. See README.md "Get the APK".

on:
  push:
    branches: ['main', 'arena/**']
    tags: ['emberhold-v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: emberhold-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Test, build and package the APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Capacitor 8 requires JDK 21 (Capacitor 6 needed 17).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests (simulation, scripts)
        run: npm test

      - name: Type check and web build
        run: npm run build

      - name: Create and prepare the Android project
        run: |
          [ -d android ] || npx cap add android
          npm run android:prepare
          npx cap sync android

      - name: Android SDK packages the project pins
        run: |
          SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMGR" ]; then
            yes | "$SDKMGR" --licenses >/dev/null 2>&1 || true
            "$SDKMGR" "platforms;android-36" "build-tools;36.0.0" >/dev/null || true
          fi

      - name: Detect repository signing secrets
        id: detect
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then echo "has_secret=true" >> "$GITHUB_OUTPUT"; else echo "has_secret=false" >> "$GITHUB_OUTPUT"; fi

      # Without repository secrets, the generated key is kept in this cache so
      # later runs sign with the same key and updates install over older builds.
      - name: Restore generated signing key
        if: steps.detect.outputs.has_secret != 'true'
        uses: actions/cache@v4
        with:
          path: ~/emberhold-keys
          key: emberhold-keystore-v1-${{ github.ref_name }}

      - name: Prepare the signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KEYS="$HOME/emberhold-keys"
          mkdir -p "$KEYS"
          if [ "${{ steps.detect.outputs.has_secret }}" = "true" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$KEYS/emberhold.jks"
            echo "EMBERHOLD_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "EMBERHOLD_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "EMBERHOLD_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          else
            if [ ! -f "$KEYS/emberhold.jks" ]; then
              echo "No signing key cached yet: generating one (kept for later runs)."
              PASS="$(openssl rand -hex 16)"
              keytool -genkeypair -keystore "$KEYS/emberhold.jks" -storepass "$PASS" -keypass "$PASS" \
                -alias emberhold -keyalg RSA -keysize 2048 -validity 20000 -dname "CN=Emberhold" >/dev/null
              printf '%s' "$PASS" > "$KEYS/password.txt"
            fi
            PASS="$(cat "$KEYS/password.txt")"
            echo "EMBERHOLD_KEYSTORE_PASSWORD=$PASS" >> "$GITHUB_ENV"
            echo "EMBERHOLD_KEY_ALIAS=emberhold" >> "$GITHUB_ENV"
            echo "EMBERHOLD_KEY_PASSWORD=$PASS" >> "$GITHUB_ENV"
          fi
          echo "EMBERHOLD_KEYSTORE=$KEYS/emberhold.jks" >> "$GITHUB_ENV"

      - name: Build the release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Check the APK contains the game and fits the size budget
        run: |
          APK=$(ls android/app/build/outputs/apk/release/*.apk | head -n 1)
          echo "APK: $APK"
          unzip -l "$APK" | grep -q "assets/public/index.html" || { echo "APK does not contain the web bundle"; exit 1; }
          SIZE=$(stat -c %s "$APK")
          LIMIT=$((25 * 1024 * 1024))
          echo "APK size: $SIZE bytes (limit $LIMIT)"
          if [ "$SIZE" -gt "$LIMIT" ]; then echo "APK exceeds 25 MiB"; exit 1; fi

      - uses: actions/upload-artifact@v4
        with:
          name: emberhold-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Attach the APK to a release for tags
        if: startsWith(github.ref, 'refs/tags/emberhold-v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/*.apk
